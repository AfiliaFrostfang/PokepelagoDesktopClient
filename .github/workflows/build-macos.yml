name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: macos-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run electron:mac

      - uses: actions/upload-artifact@v4
        with:
          name: Pokepelago-macOS
          path: release/